<!doctype html>
<html lang="en" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap"
			rel="stylesheet"
		/>
		<script src="https://telegram.org/js/telegram-web-app.js"></script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="/manifest.json" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
		/>
		<meta name="theme-color" content="#0c1929" />
		<!-- Tells the browser this page already handles dark mode itself, so it
		     doesn't apply its own heuristic auto-dark-content rewriting on top -
		     that rewriting is a known source of panels rendering with the wrong
		     (often transparent-looking) background on some Android/Chrome PWA
		     installs, since it can misinterpret CSS color-mix()/custom-property
		     based colors it doesn't fully understand. -->
		<meta name="color-scheme" content="dark" />
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
