services:
  db:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

  app:
    container_name: viz-rs
    build:
      context: ./service
      target: runtime
    environment:
     - PORT=80
    expose:
      - 3000
    ports:
      - "3000:3000"




configs:
  qdrant_config:
    content: |
      log_level: INFO      
